name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    # The suite runs in under two minutes.  A generous ceiling, but a finite one: an apt-get that stops
    # responding has no timeout of its own, and without this the job sat at the Chrome step for a quarter of
    # an hour and would have held the runner until GitHub's six-hour limit.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Chrome for the Capybara system specs
        # The ubuntu-latest image already ships Google Chrome, so the usual path is to confirm it and move
        # on.  Installing it again reached Google's apt repository on every run, which hung three runs in a
        # row while the code was fine — the mirror, not the suite.  apt-get remains the fallback for an image
        # that turns out not to have it.
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y google-chrome-stable
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare the test database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      - name: Run the RSpec suite
        env:
          RAILS_ENV: test
        run: bundle exec rspec

      - name: Keep screenshots from failed system specs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rspec-failure-screenshots
          path: ${{ github.workspace }}/tmp/capybara
          if-no-files-found: ignore

