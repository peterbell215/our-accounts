# Name of your application. Used to uniquely configure containers.
service: our_accounts

# Name of the container image.  Combined with registry.server below this is ghcr.io/peterbell215/our_accounts.
image: peterbell215/our_accounts

# Deploy to these servers.
# TODO: the droplet's IPv4 address, once it exists.
servers:
  web:
    - 192.168.0.1
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
# TODO: the real hostname, once the domain is registered.  kamal-proxy obtains the certificate over
# HTTP-01, so if the domain sits behind Cloudflare the record must be DNS-only (grey cloud) at least
# until the first certificate is issued.
proxy:
  ssl: true
  host: app.example.com

# Credentials for your image host.  ghcr.io rather than Docker Hub: private images are unlimited and
# free, and the repository is already on GitHub.  The password is a classic personal access token with
# the write:packages scope, exported as KAMAL_REGISTRY_PASSWORD in the shell you deploy from.
registry:
  server: ghcr.io
  username: peterbell215

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # The hostname the application answers to.  config/environments/production.rb refuses any other Host
    # header, so that a scanner arriving at the bare IP address gets nothing.  Keep this in step with
    # proxy.host above.
    APP_HOST: app.example.com

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use our_accounts-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"


# Use a persistent storage volume for sqlite database files and local Active Storage files.
#
# A host path rather than a named Docker volume, so that the database is an ordinary file the litestream
# accessory below can replicate and a human can scp a copy into.  The container runs as uid 1000, so the
# directory has to be owned to match:
#
#   mkdir -p /var/lib/our-accounts/storage && chown -R 1000:1000 /var/lib/our-accounts
volumes:
  - "/var/lib/our-accounts/storage:/rails/storage"


# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.3.6
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
#
# Litestream replicates the primary database's write-ahead log to object storage continuously, which is
# what makes the single droplet survivable: the machine holds the only copy otherwise.  It mounts the same
# host directory as the app above.  Only the primary database is replicated — the cache, queue and cable
# databases are derived state, and restoring a stale copy of them would be worse than starting them empty.
#
# Kamal gives accessories --restart unless-stopped, so this comes back with the droplet.
# TODO: the same droplet IPv4 as servers.web above.
accessories:
  litestream:
    image: litestream/litestream:0.5
    host: 192.168.0.1
    cmd: replicate -config /etc/litestream.yml
    volumes:
      - /var/lib/our-accounts/storage:/data
    files:
      - config/litestream.yml:/etc/litestream.yml
    env:
      secret:
        - LITESTREAM_ACCESS_KEY_ID
        - LITESTREAM_SECRET_ACCESS_KEY
